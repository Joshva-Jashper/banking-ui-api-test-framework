[pytest]
pythonpath=.
addopts =
    --browser=chromium
    -v
    -s
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --alluredir=report/allure_result
    --reruns=0
    --reruns-delay=1
   


markers =
    ui: ui automation
    smoke: smoke tests
    api: api testing
    e2e: end to end testing
    no_auth: no authentication for login test case